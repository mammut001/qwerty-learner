name: French Fork Build Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: french-fork-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.17.0
        uses: actions/setup-node@v4
        with:
          node-version: 18.17.0
          cache: yarn
      - name: Install packages
        run: yarn --frozen-lockfile
      - name: TypeScript full check
        run: yarn typecheck
      - name: Build French app
        run: yarn build
      - name: Enforce production bundle budget
        run: yarn check:bundle
