map $http_x_study_client_ip $study_client_ip {
    default $http_x_study_client_ip;
    "" $remote_addr;
}

server {
    listen       5173;
    listen  [::]:5173;
    server_name  localhost;

    # text/html is compressed automatically. Proxied API locations turn gzip off
    # so their bytes and cache headers stay whatever study-api sent.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location = /health {
        gzip off;
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Study-Client-IP $study_client_ip;
    }
    location = /api/study-plan/speech/transcribe {
        gzip off;
        client_max_body_size 6m;
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Study-Client-IP $study_client_ip;
    }
    location /api/ {
        gzip off;
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Study-Client-IP $study_client_ip;
    }
    # Vite's build manifest is build tooling, not a public asset.
    location ^~ /.vite/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
        return 404;
    }
    # Crawler files are served as real files so they never fall back to index.html.
    location = /robots.txt {
        root /app;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        root /app;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
        try_files $uri =404;
    }
    location = /sw.js {
        root /app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
        try_files $uri =404;
    }
    # Hashed /assets/ and ?v= lexicon/dicts can be cached for a year.
    # add_header here does not apply to /sw.js, /, or the API proxies above.
    location /assets/ {
        root /app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
        try_files $uri =404;
    }
    location /lexicon/ {
        root /app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
        try_files $uri =404;
    }
    location /dicts/ {
        root /app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
        try_files $uri =404;
    }
    # Self-hosted pronunciation audio (mirrored from GCS / Lingua Libre), mounted at /voice by the deployment.
    location /voice-audio/ {
        alias /voice/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
    }
    location / {
        root   /app;
        index  index.html index.htm;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-7RrDgizPQ/s7Nu94A6o0dKLsTMBtUblVKTXFk5ipr3g=' 'sha256-5TOZpLC25ofeNxGRwHoRSqJx9YWdcysHUwqJtQG5hwA=' 'sha256-mFBfPhqX8iqbklXdAWHc82OQFd6PdxLydPuHtbu8+y8=' https://www.youtube.com https://s.ytimg.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://*.googleusercontent.com; media-src 'self' blob: data: https://storage.googleapis.com https://dict.youdao.com https://upload.wikimedia.org; connect-src 'self' https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://accounts.google.com https://apis.google.com https://storage.googleapis.com https://zh.wiktionary.org https://fr.wiktionary.org; font-src 'self' data:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://appleid.apple.com; report-uri /api/study-plan/csp-report" always;
        try_files $uri $uri/index.html /index.html;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /app;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-7RrDgizPQ/s7Nu94A6o0dKLsTMBtUblVKTXFk5ipr3g=' 'sha256-5TOZpLC25ofeNxGRwHoRSqJx9YWdcysHUwqJtQG5hwA=' 'sha256-mFBfPhqX8iqbklXdAWHc82OQFd6PdxLydPuHtbu8+y8=' https://www.youtube.com https://s.ytimg.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://*.googleusercontent.com; media-src 'self' blob: data: https://storage.googleapis.com https://dict.youdao.com https://upload.wikimedia.org; connect-src 'self' https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://accounts.google.com https://apis.google.com https://storage.googleapis.com https://zh.wiktionary.org https://fr.wiktionary.org; font-src 'self' data:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://appleid.apple.com; report-uri /api/study-plan/csp-report" always;
    }
}
