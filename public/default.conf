server {
    listen       5173;
    listen  [::]:5173;
    server_name  localhost;
    location = /health {
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
    }
    location / {
        root   /app;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /app;
    }
}
