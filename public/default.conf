map $http_x_study_client_ip $study_client_ip {
    default $http_x_study_client_ip;
    "" $remote_addr;
}

server {
    listen       5173;
    listen  [::]:5173;
    server_name  localhost;

    # text/html is compressed automatically. Proxied API locations turn gzip off
    # so their bytes and cache headers stay whatever study-api sent.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location = /health {
        gzip off;
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Study-Client-IP $study_client_ip;
    }
    location = /api/study-plan/speech/transcribe {
        gzip off;
        client_max_body_size 6m;
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Study-Client-IP $study_client_ip;
    }
    location /api/ {
        gzip off;
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Study-Client-IP $study_client_ip;
    }
    # Crawler files are served as real files so they never fall back to index.html.
    location = /robots.txt {
        root /app;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        root /app;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /sw.js {
        root /app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    # Hashed /assets/ and ?v= lexicon/dicts can be cached for a year.
    # add_header here does not apply to /sw.js, /, or the API proxies above.
    location /assets/ {
        root /app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /lexicon/ {
        root /app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /dicts/ {
        root /app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Self-hosted pronunciation audio (mirrored from GCS / Lingua Libre), mounted at /voice by the deployment.
    location /voice-audio/ {
        alias /voice/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        root   /app;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /app;
    }
}
