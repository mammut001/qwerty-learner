map $http_x_study_client_ip $study_client_ip {
    default $http_x_study_client_ip;
    "" $remote_addr;
}

server {
    listen       5173;
    listen  [::]:5173;
    server_name  localhost;
    location = /health {
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Study-Client-IP $study_client_ip;
    }
    location /api/ {
        proxy_pass http://study-api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Study-Client-IP $study_client_ip;
    }
    location = /sw.js {
        root /app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location / {
        root   /app;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /app;
    }
}
