services:
  qwertylearner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_STUDY_API_BASE_URL: ${VITE_STUDY_API_BASE_URL:-}
    ports:
      - '8990:5173'
    depends_on:
      - study-api
  study-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      HOST: 0.0.0.0
      STUDY_DB_PATH: /data/study-plan.sqlite
      STUDY_ORIGIN: ${STUDY_ORIGIN:-http://localhost:8990}
      STUDY_COOKIE_SAME_SITE: ${STUDY_COOKIE_SAME_SITE:-strict}
      STUDY_COOKIE_SECURE: ${STUDY_COOKIE_SECURE:-false}
      STUDY_TRUST_PROXY_IP: 'true'
      # Optional: require this password before any data route answers (personal deployments).
      STUDY_ACCESS_PASSWORD: ${STUDY_ACCESS_PASSWORD:-}
    volumes:
      - study-data:/data
    restart: unless-stopped
volumes:
  study-data:
